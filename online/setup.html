<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Einrichtung – Token verschlüsseln</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #FBF7EE; color: #5b5646; margin: 0; padding: 24px; }
  .card { max-width: 620px; margin: 0 auto; background: #fff; border: 1px solid #e4dcc8; border-radius: 18px; padding: 28px; }
  h1 { color: #1E3A5F; font-size: 22px; margin-top: 0; }
  label { display: block; font-size: 13px; margin: 14px 0 4px; }
  input, textarea { width: 100%; box-sizing: border-box; padding: 9px 10px; border: 1px solid #e4dcc8; border-radius: 8px; font-family: monospace; font-size: 14px; }
  textarea { min-height: 120px; }
  button { margin-top: 16px; background: #1E3A5F; color: #fff; border: none; border-radius: 12px; padding: 12px 18px; font-size: 15px; font-weight: 600; cursor: pointer; }
  .note { font-size: 13px; line-height: 1.5; margin-top: 12px; }
  .err { color: #C1483B; } .ok { color: #2F7A4D; }
</style>
</head>
<body>
<div class="card">
  <h1>Token verschlüsseln</h1>
  <p class="note">Diese Seite läuft komplett in deinem Browser. Token und Zugangsphrase werden nirgends gesendet oder gespeichert. Das Ergebnis ist ein verschlüsselter Block, den du in <code>config.json</code> unter <code>remote.tokenBlob</code> einträgst.</p>

  <label for="access">Zugangsphrase (6 Wörter)</label>
  <input type="text" id="access" autocomplete="off" autocapitalize="off" spellcheck="false" />

  <label for="token">GitHub-Token (fine-grained, nur Repo vokabeltrainer-daten, Contents: Read and write)</label>
  <input type="password" id="token" autocomplete="off" spellcheck="false" />

  <button onclick="run()">Verschlüsseln</button>
  <div class="note" id="msg"></div>

  <label for="out">Ergebnis: in config.json als Wert von „tokenBlob“ einfügen</label>
  <textarea id="out" readonly></textarea>
</div>

<script src="remote.js"></script>
<script>
async function run() {
  const access = document.getElementById('access').value;
  const token = document.getElementById('token').value.trim();
  const msg = document.getElementById('msg');
  const out = document.getElementById('out');
  out.value = '';
  if (VTRemote.normWords(access).split(' ').length !== 6) { msg.className = 'note err'; msg.textContent = 'Die Zugangsphrase braucht genau 6 Wörter.'; return; }
  if (!token) { msg.className = 'note err'; msg.textContent = 'Bitte das Token eingeben.'; return; }
  try {
    const blob = await VTRemote.encryptToken(access, token);
    // Probe: mit derselben Phrase muss das Token wieder herauskommen
    const back = await VTRemote.unlockToken(blob, access);
    if (back !== token) throw new Error('Probe fehlgeschlagen');
    out.value = JSON.stringify(blob);
    msg.className = 'note ok';
    msg.textContent = '✓ Verschlüsselt und geprüft. Den Block in config.json eintragen und committen.';
  } catch (e) {
    msg.className = 'note err';
    msg.textContent = 'Fehler: ' + e.message;
  }
}
</script>
</body>
</html>
